<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/Signup Form</title>
    <link rel="stylesheet" href="SignUp_LogIn_Form.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <main class="container">
        <section class="visual-panel" aria-label="Library visual">
            <span class="shape shape-circle"></span>
            <span class="shape shape-triangle"></span>
            <span class="shape shape-triangle-bottom"></span>
            <span class="shape shape-square"></span>
            <span class="shape shape-dot"></span>
            <div class="visual-card">
                <img src="./web/hinhanh/ACQ_BEST_EVIDENCE_IMAGE.jpg" alt="Library evidence illustration">
            </div>
        </section>

        <section class="forms-panel">
            <div class="form-box login">
                <form action="#">
                    <h1>Member Login</h1>
                    <div class="input-box">
                        <input type="text" placeholder="Username" required>
                        <i class='bx bxs-user'></i>
                    </div>
                    <div class="input-box">
                        <input type="password" placeholder="Password" required>
                        <i class='bx bxs-lock-alt'></i>
                    </div>
                    <button type="submit" class="btn">LOGIN</button>
                    <div class="forgot-link">
                        <a href="forgotpassword.html">Forgot Username / Password?</a>
                    </div>
                    <p class="social-text">or login with social platforms</p>
                    <div class="social-icons">
                        <a href="#" class="social-btn"><i class='bx bxl-google'></i></a>
                        <a href="#" class="social-btn"><i class='bx bxl-facebook'></i></a>
                        <a href="#" class="social-btn"><i class='bx bxl-github'></i></a>
                        <a href="#" class="social-btn"><i class='bx bxl-linkedin'></i></a>
                    </div>
                </form>
            </div>

            <div class="form-box register">
                <form action="#">
                    <h1>Create Account</h1>
                    <div class="input-box">
                        <input type="text" placeholder="Username" required>
                        <i class='bx bxs-user'></i>
                    </div>
                    <div class="input-box">
                        <input type="email" placeholder="Email" required>
                        <i class='bx bxs-envelope'></i>
                    </div>
                    <div class="input-box">
                        <input type="password" placeholder="Password" required>
                        <i class='bx bxs-lock-alt'></i>
                    </div>
                    <button type="submit" class="btn">REGISTER</button>
                    <p class="social-text">or register with social platforms</p>
                    <div class="social-icons">
                        <a href="#" class="social-btn"><i class='bx bxl-google'></i></a>
                        <a href="#" class="social-btn"><i class='bx bxl-facebook'></i></a>
                        <a href="#" class="social-btn"><i class='bx bxl-github'></i></a>
                        <a href="#" class="social-btn"><i class='bx bxl-linkedin'></i></a>
                    </div>
                </form>
            </div>

            <div class="form-footer">
                <button class="switch-link register-btn" type="button">
                    Create your Account
                    <i class='bx bx-right-arrow-alt'></i>
                </button>
                <button class="switch-link login-btn" type="button">
                    <i class='bx bx-left-arrow-alt'></i>
                    Back to Login
                </button>
            </div>
        </section>
    </main>

    <div id="toast"
        style="display:none; position:fixed; top:20px; right:20px; padding:12px 20px;
                background:#4CAF50; color:white; border-radius:8px;
                box-shadow:0 4px 8px rgba(0,0,0,0.2); z-index:9999;">
    </div>

    <script src="SignUp_LogIn_Form.js"></script>
    <script>
    const API_URL = "http://127.0.0.1:3000";

    window.addEventListener("DOMContentLoaded", () => {
        const registerForm = document.querySelector(".register form");

        registerForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            const username = registerForm.querySelector('input[placeholder="Username"]').value.trim();
            const email = registerForm.querySelector('input[placeholder="Email"]').value.trim();
            const password = registerForm.querySelector('input[placeholder="Password"]').value.trim();

            try {
                const res = await fetch(`${API_URL}/register`, {
                    credentials: "include",
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, email, password }),
                });

                const data = await res.json();
                if (res.ok) {
                    showToast(data.message);
                    registerForm.reset();
                } else {
                    showToast(data.message || "Dang ky that bai!", true);
                }
            } catch (err) {
                console.error(err);
                showToast("Khong the ket noi den server!", true);
            }
        });
    });

    document.querySelector('.login form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.querySelector('.login input[placeholder="Username"]').value;
        const password = document.querySelector('.login input[placeholder="Password"]').value;

        const res = await fetch(`${API_URL}/login`, {
            credentials: "include",
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (res.ok) {
            showToast(data.message);
            localStorage.setItem("loggedInUser", username);
            setTimeout(() => {
                window.location.href = data.role === "super_admin" || data.role === "admin" || data.role === "librarian"
                    ? "/web/admin.html"
                    : "/web/index.html";
            }, 1500);
        } else {
            showToast(data.message || 'Sai ten dang nhap hoac mat khau!', true);
        }
    });

    document.querySelectorAll(".social-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
            e.preventDefault();
            showToast("Tinh nang nay chua duoc ho tro!", true);
        });
    });
    </script>
</body>
</html>
